# nginx-unprivileged: corre como usuario no-root y escucha en 8080.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Las rutas del backend ya empiezan por /api (MapGroup("/api/orders")), así que
    # proxy_pass va SIN barra final: reenvía /api/orders tal cual. Con "http://orders-api:8080/"
    # nginx quitaría el prefijo /api/ y el backend respondería 404.
    location /api/ {
        proxy_pass http://orders-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets con hash en el nombre: se pueden cachear para siempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fallback de SPA; index.html nunca se cachea para que un deploy nuevo se vea al recargar
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
