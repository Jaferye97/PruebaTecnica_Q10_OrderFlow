# Los secretos salen del .env de la raíz.
x-rabbitmq-env: &rabbitmq-env
  RabbitMq__Host: rabbitmq
  RabbitMq__Port: "5672"
  RabbitMq__User: "${RABBITMQ_USER:?Define RABBITMQ_USER en el .env}"
  RabbitMq__Password: "${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en el .env}"

x-backend-depends: &backend-depends
  db-init:
    condition: service_completed_successfully
  rabbitmq:
    condition: service_healthy

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:?Define SA_PASSWORD en el .env}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:?Define RABBITMQ_USER en el .env}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en el .env}"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Crea las bases, las tablas y los datos de prueba con los scripts de db/init/ (no hay
  # migraciones de EF). Los scripts son idempotentes: se ejecutan en cada `up` y terminan.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SQLCMDPASSWORD: "${SA_PASSWORD:?Define SA_PASSWORD en el .env}"
    volumes:
      - ./db/init:/scripts:ro
    # -I: QUOTED_IDENTIFIER ON · -b: sale con error si falla un batch · -f 65001: scripts en UTF-8
    entrypoint:
      - /opt/mssql-tools18/bin/sqlcmd
      - -S
      - sqlserver,1433
      - -U
      - sa
      - -C
      - -I
      - -b
      - -f
      - "65001"
      - -i
      - /scripts/01-orders.sql
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  # Sin healthcheck: la imagen chiseled no tiene shell ni curl.
  orders-api:
    build:
      context: ./backend
      dockerfile: Orders.Infrastructure.In.WebApi/Dockerfile
    environment:
      <<: *rabbitmq-env
      # Server=sqlserver: dentro de la red de Docker cada servicio se encuentra por su nombre
      ConnectionStrings__OrdersDb: "Server=sqlserver,1433;Database=OrdersDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      OpenApi__Enabled: "true" # Scalar en http://localhost:8080/scalar
    ports:
      - "8080:8080"
    depends_on: *backend-depends

  # SPA servida por nginx (no-root, 8080). nginx reenvía /api/ a orders-api por la red interna.
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      - orders-api

volumes:
  sqlserver-data:
  rabbitmq-data:
